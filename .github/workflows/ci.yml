name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_tests:
        description: "UI-Tests im Simulator zusätzlich ausführen (langsam)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Xcode 27.2 is preinstalled on the xcode-27 runner image (its default there is 27.1).
  XCODE_APP: /Applications/Xcode_27.2.app

jobs:
  unit-tests:
    name: Unit-Tests
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Xcode auswählen
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version
      - name: SwiftPM-Cache
        uses: actions/cache@v6
        with:
          path: IndoorCoachKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('IndoorCoachKit/Package.swift', 'IndoorCoachKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: swift test
        working-directory: IndoorCoachKit
        run: swift test

  app-build:
    name: App-Build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Xcode auswählen
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Build (iOS-Simulator, ohne Signierung)
        run: |
          set -o pipefail
          xcodebuild build \
            -project IndoorCoach.xcodeproj \
            -scheme IndoorCoach \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet | xcbeautify --quieter

  ui-tests:
    name: UI-Tests (manuell)
    if: github.event_name == 'workflow_dispatch' && inputs.ui_tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Xcode auswählen
        run: sudo xcode-select -s "$XCODE_APP"
      - name: UI-Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project IndoorCoach.xcodeproj \
            -scheme IndoorCoach \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --quieter
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-results
          path: ${{ runner.temp }}/ui.xcresult
          retention-days: 7
